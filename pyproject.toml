[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retail-mlops"
version = "0.1.0"
description = "Chaîne MLOps de prévision hebdomadaire des quantités vendues par produit (UCI Online Retail)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
# Versions bornées : compatibles entre elles, verrouillées précisément dans requirements.lock
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=2.1,<2.3",
    "pyarrow>=18,<20",
    "openpyxl>=3.1,<3.2",
    "pandera>=0.20,<0.21",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<1.8",
    "mlflow>=2.16,<3",
    "fastapi>=0.115,<0.151",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<0.7",
    "pre-commit>=3.7,<4",
    "httpx>=0.27,<1",
    "locust>=2.32,<3",
]
orch = [
    "prefect>=3.1,<4",
]
load = [
    "locust>=2.32,<3",
]

[project.scripts]
retail = "retail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["integration: tests plus lents qui enchaînent plusieurs étapes"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["retail"]

[tool.coverage.run]
source = ["retail"]
